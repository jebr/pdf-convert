[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-convert"
version = "1.0.0"
description = "Zet PDF's in een map opnieuw om met Ghostscript en bewaart de originelen."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jeroen Brauns" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
convertpdf = "convertpdf:main"

[tool.setuptools]
py-modules = ["convertpdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert en subprocess zijn in tests prima
"tests/*" = ["S101", "S603"]
# subprocess met vaste argumentenlijst, zonder shell
"convertpdf.py" = ["S603"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["convertpdf.py", "tests"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404", "B603"]
